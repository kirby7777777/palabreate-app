<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Palabréate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-glow: #1e293b;
            --surface: rgba(30, 41, 59, 0.85);
            --surface-border: rgba(255, 255, 255, 0.15);
            --primary: #00f2fe;
            --accent: #ff007f;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --correct: #10b981;
            --present: #f59e0b;
            --absent: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top, #312e81 0%, #0f172a 100%); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 4px 8px; overflow: hidden; }

        .modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
        .modal-card { background: var(--surface); border: 1px solid var(--surface-border); padding: 18px; border-radius: 18px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, #00f2fe 0%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        
        .input-user { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--surface-border); background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; margin: 10px 0; text-align: center; font-weight: 700; }
        .btn-main { background: linear-gradient(135deg, var(--primary) 0%, #4facfe 100%); color: #000; border: none; width: 100%; padding: 10px; font-weight: 800; font-size: 0.9rem; border-radius: 10px; cursor: pointer; margin-top: 4px; }

        header { text-align: center; margin: 0; width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .hud { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px; padding: 4px 10px; width: 100%; max-width: 360px; margin-bottom: 3px; }
        .hud-item { display: flex; flex-direction: flex-row; align-items: center; gap: 6px; }
        .hud-label { font-size: 0.55rem; color: var(--text-sub); font-weight: 800; text-transform: uppercase; }
        .hud-value { font-size: 0.95rem; font-weight: 900; color: var(--primary); }

        .shop-container { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 360px; margin-bottom: 3px; }
        .shop-btn { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-main); padding: 4px; border-radius: 8px; font-size: 0.65rem; font-weight: 700; cursor: pointer; display: flex; justify-content: space-around; align-items: center; }
        .shop-btn span.cost { color: var(--primary); font-size: 0.6rem; font-weight: 800; }

        .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 4px; width: 100%; max-width: 270px; height: 260px; margin: 0 auto 2px auto; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: rgba(15, 23, 42, 0.4); border: 2px solid rgba(255, 255, 255, 0.12); border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: 900; text-transform: uppercase; }
        .cell.correct { background: var(--correct); border-color: var(--correct); }
        .cell.present { background: var(--present); border-color: var(--present); }
        .cell.absent { background: var(--absent); border-color: transparent; color: var(--text-sub); }

        /* Teclado ampliado y optimizado */
        .keyboard { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 370px; margin-bottom: 6px; }
        .kbd-row { display: flex; justify-content: center; gap: 4px; }
        .key { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-main); font-size: 0.85rem; font-weight: 800; height: 44px; border-radius: 6px; cursor: pointer; flex: 1; max-width: 34px; display: flex; justify-content: center; align-items: center; padding: 0; }
        .key.large { max-width: 52px; font-size: 0.65rem; }
        .key.disabled { opacity: 0.2; pointer-events: none; background: #000; }

        .next-timer { font-size: 0.75rem; color: var(--primary); font-weight: 800; margin-top: 4px; display: block; }
        .leaderboard-list { text-align: left; margin: 8px 0; max-height: 200px; overflow-y: auto; }
        .leader-item { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid var(--surface-border); font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Modal Registro Usuario -->
    <div class="modal-screen" id="user-modal">
        <div class="modal-card">
            <div class="modal-title">PALABRÉATE</div>
            <p style="font-size: 0.8rem; color: var(--text-sub);">Elige tu nombre de jugador para la clasificación diaria</p>
            <input type="text" id="username-input" class="input-user" placeholder="Nombre de usuario..." maxlength="12">
            <button class="btn-main" onclick="registerUser()">GUARDAR E INICIAR</button>
        </div>
    </div>

    <!-- Modal Clasificación -->
    <div class="modal-screen" id="leaderboard-modal" style="display: none;">
        <div class="modal-card">
            <div class="modal-title">CLASIFICACIÓN</div>
            <p style="font-size: 0.75rem; color: var(--text-sub);">Resultados de hoy</p>
            <div class="leaderboard-list" id="leaderboard-content"></div>
            <button class="btn-main" onclick="closeLeaderboard()">VOLVER AL JUEGO</button>
        </div>
    </div>

    <header>
        <div class="logo">PALABRÉATE</div>
        <button onclick="openLeaderboard()" style="background:var(--surface); border:1px solid var(--surface-border); color:#fff; padding:4px 10px; border-radius:6px; font-size:0.7rem; font-weight:800; cursor:pointer;">🏆 Ranking</button>
    </header>

    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">Jugador:</span>
            <span class="hud-value" id="user-display" style="color:#fff;">-</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Créditos:</span>
            <span class="hud-value" id="credits">100</span>
        </div>
    </div>

    <div class="shop-container">
        <button class="shop-btn" id="btn-filter" onclick="buyFilter()">
            <span>Descarte (-5)</span>
            <span class="cost">-20 cr</span>
        </button>
        <button class="shop-btn" id="btn-radar" onclick="buyRadar()">
            <span>Radar Letra</span>
            <span class="cost">-35 cr</span>
        </button>
    </div>

    <div id="status-banner" style="text-align: center; font-size: 0.75rem; font-weight: 800; color: var(--primary); display: none;"></div>

    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>

    <script>
        const DICTIONARY = ["PLAZA","AUDIO","CARTA","JUEGO","LIBRO","FLOR","TEXTO","BARCO","MUNDO","SUEÑO","CLAVE","RITMO","SABOR","NUBE","NORTES","FUEGO","PLAYA","VISION","MARTE","ARBOL"];
        let secretWord = "", currentAttempt = 0, currentTile = 0, credits = 100;
        let boardState = Array(6).fill("").map(() => Array(5).fill(""));
        let todayKey = "", username = "", usedPowerups = false, gameCompleted = false;

        function getDailyWord() {
            const now = new Date();
            todayKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            let hash = 0;
            for (let i = 0; i < todayKey.length; i++) hash = todayKey.charCodeAt(i) + ((hash << 5) - hash);
            return DICTIONARY[Math.abs(hash) % DICTIONARY.length];
        }

        function initGame() {
            username = localStorage.getItem('palabreate_username');
            if (!username) {
                document.getElementById('user-modal').style.display = 'flex';
            } else {
                document.getElementById('user-modal').style.display = 'none';
                document.getElementById('user-display').textContent = username;
            }

            const savedCredits = localStorage.getItem('palabreate_credits');
            credits = savedCredits !== null ? parseInt(savedCredits) : 100;
            document.getElementById("credits").textContent = credits;

            secretWord = getDailyWord();
            renderBoard();
            renderKeyboard();

            // Verificar si ya completó el reto de HOY
            const lastPlayed = localStorage.getItem('palabreate_last_played');
            if (lastPlayed === todayKey) {
                gameCompleted = true;
                lockGameUI();
            }
        }

        function registerUser() {
            const val = document.getElementById('username-input').value.trim();
            if (val.length < 2) return alert("Introduce un nombre válido.");
            username = val;
            localStorage.setItem('palabreate_username', username);
            document.getElementById('user-modal').style.display = 'none';
            document.getElementById('user-display').textContent = username;
        }

        function renderBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";
            for (let r = 0; r < 6; r++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${r}-${c}`;
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
        }

        function renderKeyboard() {
            const keyboard = document.getElementById("keyboard");
            keyboard.innerHTML = "";
            const rows = [
                ["Q","W","E","R","T","Y","U","I","O","P"],
                ["A","S","D","F","G","H","J","K","L","Ñ"],
                ["ENTER","Z","X","C","V","B","N","M","DEL"]
            ];
            rows.forEach(r => {
                const kbdRow = document.createElement("div");
                kbdRow.className = "kbd-row";
                r.forEach(key => {
                    const btn = document.createElement("button");
                    btn.className = "key";
                    btn.id = `key-${key}`;
                    btn.textContent = key;
                    if (key === "ENTER" || key === "DEL") btn.classList.add("large");
                    btn.onclick = () => handleKeyPress(key);
                    kbdRow.appendChild(btn);
                });
                keyboard.appendChild(kbdRow);
            });
        }

        function handleKeyPress(key) {
            if (gameCompleted || currentAttempt >= 6) return;
            if (key === "DEL") {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentAttempt][currentTile] = "";
                    document.getElementById(`cell-${currentAttempt}-${currentTile}`).textContent = "";
                }
            } else if (key === "ENTER") {
                if (currentTile === 5) submitAttempt();
            } else if (/^[A-ZÑ]$/.test(key) && currentTile < 5) {
                boardState[currentAttempt][currentTile] = key;
                document.getElementById(`cell-${currentAttempt}-${currentTile}`).textContent = key;
                currentTile++;
            }
        }

        function submitAttempt() {
            if (gameCompleted) return;

            const guess = boardState[currentAttempt].join("");
            const rowCells = document.querySelectorAll(`#board .row:nth-child(${currentAttempt + 1}) .cell`);
            
            for (let i = 0; i < 5; i++) {
                if (guess[i] === secretWord[i]) rowCells[i].classList.add("correct");
                else if (secretWord.includes(guess[i])) rowCells[i].classList.add("present");
                else rowCells[i].classList.add("absent");
            }

            if (guess === secretWord) {
                finishDailyGame(true);
            } else {
                currentAttempt++;
                currentTile = 0;
                if (currentAttempt >= 6) {
                    finishDailyGame(false);
                }
            }
        }

        function finishDailyGame(success) {
            gameCompleted = true;
            localStorage.setItem('palabreate_last_played', todayKey);
            saveResult(success);
            lockGameUI();

            setTimeout(() => {
                if (success) alert("¡Enhorabuena! Has completado el reto de hoy.");
                else alert(`Fin del juego. La palabra era: ${secretWord}`);
            }, 200);
        }

        function lockGameUI() {
            document.getElementById("btn-filter").disabled = true;
            document.getElementById("btn-radar").disabled = true;
            document.getElementById("btn-filter").style.opacity = "0.4";
            document.getElementById("btn-radar").style.opacity = "0.4";

            const keys = document.querySelectorAll(".key");
            keys.forEach(k => k.classList.add("disabled"));

            const banner = document.getElementById("status-banner");
            banner.style.display = "block";
            updateCountdown();
            setInterval(updateCountdown, 60000);
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById("status-banner").innerHTML = `✔ Reto completado. Próxima palabra en: <strong>${hours}h ${mins}m</strong>`;
        }

        function buyFilter() {
            if (gameCompleted) return;
            if (credits < 20) return alert("No tienes suficientes créditos.");
            credits -= 20;
            usedPowerups = true;
            localStorage.setItem('palabreate_credits', credits);
            document.getElementById("credits").textContent = credits;

            let removed = 0;
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÑ".split("");
            for (let letter of alphabet) {
                if (!secretWord.includes(letter) && removed < 5) {
                    const keyEl = document.getElementById(`key-${letter}`);
                    if (keyEl && !keyEl.classList.contains("disabled")) {
                        keyEl.classList.add("disabled");
                        removed++;
                    }
                }
            }
        }

        function buyRadar() {
            if (gameCompleted) return;
            if (credits < 35) return alert("No tienes suficientes créditos.");
            credits -= 35;
            usedPowerups = true;
            localStorage.setItem('palabreate_credits', credits);
            document.getElementById("credits").textContent = credits;

            for (let i = 0; i < 5; i++) {
                const cell = document.getElementById(`cell-${currentAttempt}-${i}`);
                if (!cell.textContent) {
                    cell.textContent = secretWord[i];
                    cell.classList.add("correct");
                    boardState[currentAttempt][i] = secretWord[i];
                    currentTile = Math.min(5, currentTile + 1);
                    break;
                }
            }
        }

        function saveResult(success) {
            let leaderboard = JSON.parse(localStorage.getItem('palabreate_leaderboard') || "[]");
            // Evitar duplicados del mismo usuario hoy
            leaderboard = leaderboard.filter(item => item.user !== username);
            leaderboard.push({
                user: username,
                success: success,
                usedPowerups: usedPowerups,
                creditsLeft: credits
            });
            localStorage.setItem('palabreate_leaderboard', JSON.stringify(leaderboard));
        }

        function openLeaderboard() {
            const list = document.getElementById('leaderboard-content');
            list.innerHTML = "";
            let leaderboard = JSON.parse(localStorage.getItem('palabreate_leaderboard') || "[]");
            
            if (leaderboard.length === 0) {
                list.innerHTML = "<div style='text-align:center; color:var(--text-sub); padding:10px;'>Sin registros hoy</div>";
            } else {
                leaderboard.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'leader-item';
                    row.innerHTML = `
                        <span><strong>${item.user}</strong> ${item.usedPowerups ? '⚡' : ''}</span>
                        <span>${item.success ? '✔ Ganado' : '✘ Fallado'} | 🪙 ${item.creditsLeft}</span>
                    `;
                    list.appendChild(row);
                });
            }
            document.getElementById('leaderboard-modal').style.display = 'flex';
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').style.display = 'none';
        }

        initGame();
    </script>
</body>
</html>
